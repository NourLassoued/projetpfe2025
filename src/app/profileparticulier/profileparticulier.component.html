<body>

        <div class="profile-image">
          <div id="profile-container">
            <div class="image-wrapper">
              <img *ngIf="profileImageUrl" [src]="profileImageUrl" alt="" class="profile-img">
            </div>
          </div>
        </div>
  
        <div class="user-info">
          <div class="section">
            <label>👤 Nom de l'utilisateur</label>
            <p>{{ user?.nom }}</p>
          </div>
  
          <div class="section">
            <i class="fas fa-map-marker-alt location-icon"></i>
            <span>{{user?.adresse?.governoate  }}</span>
          </div>
  
          
          
        </div>
      </div>
    </div>
  
    <app-footer></app-footer>
  </body>
