<nav class="navbar">
    <div class="logo">PrestatairePro</div>
    <button  (click)="showSkillModal()" class="middle-btn" *ngIf="userRole === 'PARTICULIER'" ><i class="fa fa-plus"></i> Demander un service</button>
    <div    (ngSubmit)="onSearch()" class="modal" *ngIf="showModal">
        <div class="modal-content"  >
          <span class="close" (click)="showModal = false">&times;</span>
          <h2>Demander un service</h2>
  
      
          <!-- Barre de recherche -->
          <input   type="text" id="search-docs" name="searchdocs"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"   placeholder="🔍 De quel service avez-vous besoin ?" class="search-bar">
      
          <!-- Affichage des catégories en grille -->
          <div class="grid-container">
            <div class="category-card" *ngFor="let category of filteredCategories; let i = index" (click)="selectCategory(category.nom) ">
              <img  [src]="imageUrls[i]" alt="{{ category.nom }}" *ngIf="imageUrls[i]">
              <span>{{ category.nom }}</span>
              <span class="icon">➜</span>
            </div>
          
          </div>
        </div>
       
      </div>
      <div class="modal" *ngIf="showServiceModal">
        <div class="modal-content">
          <span class="close"(click)="closeServiceModal()" >&times;</span>
          <h2> {{ selectedCategory?.nom }}</h2>
          <input type="text" placeholder="🔍 De quel service avez-vous besoin " class="search-bar2"
          [(ngModel)]="searchQuery"
          (input)="filterServices()">
          
       <div class="grid-container">
        
        <div class="category-card" *ngFor="let service of filteredServices; let i = index" (click)="selectService(service)">
            <img *ngIf="imageUrls[i]" [src]="imageUrls[i]" alt="{{ service.nomservice }}" class="service-image">
            <label for="service-{{ service.idservice }}">{{ service.nomservice }}</label>
          
  
              <input 
                class="iconn" 
                type="checkbox" 
                id="service-{{ service.idservice }}" 
                
                >
          </div>
          </div>
        </div>
    </div>
  
    
    <div class="nav-icons">
        <a href="#"><i class="fas fa-envelope"></i></a>
      <!-- Icône de notification -->
<div class="notification-container">
  <a href="#" (click)="toggleNotification()" class="notification-icon">
    <i class="fas fa-bell"></i>
    <span *ngIf="unreadCount > 0" class="badge">{{ unreadCount }}</span>
  </a>

  <!-- Liste déroulante des notifications -->
  <div *ngIf="showNotification" class="notification-dropdown">
    <div *ngIf="notifications.length === 0">
      <p>Aucune notification</p>
    </div>
    <div *ngFor="let message of notifications"   (click)="goToComptePrestataireAvecMessage(message)" class="notification-item">
      {{ message }}
    </div>
  </div>
</div>

        
        <div id="profile-container">
            <ng-container *ngIf="profileImageUrl; else defaultIcon">
                <img [src]="profileImageUrl" alt="Photo de profil" id="profile-icon"/>
            </ng-container>
            <ng-template #defaultIcon>
                <i class="fas fa-user default-icon"></i> 
            </ng-template>
        </div>

        <i class="fas fa-bars" id="menu-icon" (click)="toggleMenu()"></i> 
    </div>

    <div class="profile-menu" id="profile-menu"   [ngClass]="{'active': isMenuOpen}">
        <ul>
          <li [routerLink]="userRole === 'PRESTATAIRE' ? '/Compteprestaitre' : userRole === 'ENTREPRISE' ? '/Compteprestaitre' : '/Compteparticulier'">
            📌 Tableau de bord 
          </li>
            <li [routerLink]="userRole === 'PRESTATAIRE' ? '/ProfileUtilisateur' : userRole === 'ENTREPRISE' ? '/Profileentreprise' : '/Profileparticulier'">👤 Voir mon profil</li>
            <li>✉️ Mes messages</li>
            <li [routerLink]="userRole === 'PRESTATAIRE' ? '/updateprestaitre' : (userRole === 'ENTREPRISE' ? '/UpdateEntreprise' : '/Updateparticulier')">
                ⚙️ Mon compte
              </li>
            <li>❓Besoin d'aide?</li>
            <li id="logout-btn" (click)="logout()">🚪 Se déconnecter</li>
        </ul>
    </div>
</nav>
