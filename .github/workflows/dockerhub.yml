name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - Front

jobs:
  push_to_dockerhub:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUBNOUR }}
          password: ${{ secrets.DOCKERHUBNOURPFE }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nourlassoued/nourangular:1.1.${{ github.run_number }}
      - name: Checkout argocdpfe  repo
        uses: actions/checkout@v4
        with:
          repository: NourLassoued/argocdpfe 
          ref: master
        
          path: argocdpfe 
          token: ${{ secrets.CHCR_TOKEN }} 

      - name: Update image tag in angular.yml 
        run: |
          IMAGE_TAG="1.1.${{ github.run_number }}"
           sed -i "s|image: nourlassoued/nourangular:[^[:space:]]*|image: nourlassoued/nourangular:${IMAGE_TAG}|" argocdpfe/angular-app/templates/values.yaml

 

      - name: Commit and push changes to argocdpfe repo
        run: |
           cd argocdpfe
           git config user.name "GitHub Actions"
           git config user.email "github-action@github.com"
           git add angular-app/templates/values.yaml

           if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
           else
            git commit -m " nour Update Docker image tag to 1.1.${{ github.run_number }}"
            git push
            fi