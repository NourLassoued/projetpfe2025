name: Build and Push Docker Image to Docker Hub 

on:
  push:
    branches:
      - Front

jobs:
  push_to_dockerhub:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUBNOUR }}
          password: ${{ secrets.DOCKERHUBNOURPFE }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nourlassoued/nourangular:1.1.${{ github.run_number }}

      - name: Scan image with Trivy (JSON output)
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.15.0
        with:
          image-ref: nourlassoued/nourangular:1.1.${{ github.run_number }}
          format: json
          output: trivy-report.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Résumé des vulnérabilités (Score)
        run: |
          echo "Résultat du scan Trivy (extrait du JSON):"
          CRITICAL=$(jq '[.[] | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json)
          HIGH=$(jq '[.[] | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json)
          MEDIUM=$(jq '[.[] | .Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-report.json)
          LOW=$(jq '[.[] | .Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-report.json)

          echo "🛑 CRITICAL : $CRITICAL"
          echo "🚨 HIGH     : $HIGH"
          echo "⚠️  MEDIUM   : $MEDIUM"
          echo "ℹ️  LOW      : $LOW"
        shell: bash

          
      - name: Checkout argocdpfe  repo
        uses: actions/checkout@v4
        with:
          repository: NourLassoued/argocdpfe 
          ref: master
        
          path: argocdpfe 
          token: ${{ secrets.CHCR_TOKEN}} 

      - name: Update image tag in angular.yml 
        run: |
          IMAGE_TAG="1.1.${{ github.run_number }}"
          sed -i "/angular:/,/^[^ ]/ s/^\s*tag: \".*\"/ tag: \"${IMAGE_TAG}\"/" argocdpfe/angular-app/values.yaml

      - name: Debug updated values.yaml
        run: |
          echo "----- Updated values.yaml -----"
          cat argocdpfe/angular-app/values.yaml
          echo "--------------------------------"

      - name: Commit and push changes to argocdpfe repo
        run: |
          cd argocdpfe
          git config user.name "GitHub Actions"
          git config user.email "github-action@github.com"
          git add angular-app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Update Docker image tag to 1.1.${{ github.run_number }}"
            git push
          fi