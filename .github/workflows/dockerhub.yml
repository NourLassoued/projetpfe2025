name: Build and Push Spring Boot Docker Image

on:
  push:
    branches:
      - master

jobs:
  build_and_push:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --no-transfer-progress -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUBNOUR }}
          password: ${{ secrets.DOCKERHUB_TOKENSPRING }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nourlassoued/nourspring:1.0.${{ github.run_number }}
            - name: Checkout argocdpfe repo
              uses: actions/checkout@v4
              with:
                repository: NourLassoued/argocdpfe
                ref: master
                path: argocdpfe
                token: ${{ secrets.CHCR_TOKEN }}

            - name: Update image tag in values.yaml for Spring Boot
              run: |
                IMAGE_TAG="1.0.${{ github.run_number }}"
                sed -i "/springboot:/,/^[^ ]/ s/^\s*tag: \".*\"/    tag: \"${IMAGE_TAG}\"/" argocdpfe/angular-app/values.yaml

            - name: Debug updated values.yaml
              run: |
                echo "----- Updated values.yaml -----"
                cat argocdpfe/angular-app/values.yaml
                echo "--------------------------------"

            - name: Commit and push changes to argocdpfe repo
              run: |
                cd argocdpfe
                git config user.name "GitHub Actions"
                git config user.email "github-action@github.com"
                git add angular-app/values.yaml
                
                if git diff --cached --quiet; then
                  echo "No changes to commit"
                  exit 0
                else
                  git commit -m "Update Spring Boot image tag to 1.0.${{ github.run_number }}"
                  git push
                fi

