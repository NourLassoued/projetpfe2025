name: Build and Push Spring Boot Docker Image

on:
  push:
    branches:
      - master

jobs:
  build_and_push:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            nc -z localhost 3306 && echo "MySQL is up!" && break
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Build and test with Maven
        run: mvn clean verify --no-transfer-progress -B | tee maven-test.log

      - name: Generate Surefire HTML Report
        run: mvn surefire-report:report

      - name: Créer résumé des tests et liste des échecs
        id: test_summary
        run: |
          PASSED=$(grep "Tests run:" maven-test.log | awk -F '[,:]' '{run+=$2; fail+=$4; err+=$6; skip+=$8} END {print run - fail - err - skip}')
          FAILED=$(grep "Tests run:" maven-test.log | awk -F '[,:]' '{fail+=$4; err+=$6} END {print fail + err}')
          TOTAL=$(grep "Tests run:" maven-test.log | awk -F '[,:]' '{total+=$2} END {print total}')

          echo "summary=✔️ Succès: $PASSED / ❌ Échecs: $FAILED / 🔢 Total: $TOTAL" >> $GITHUB_OUTPUT

          grep "<<< FAILURE!" target/surefire-reports/* > failed_tests.txt || echo "🔸 Aucun test échoué." > failed_tests.txt
          echo "failures=$(cat failed_tests.txt)" >> $GITHUB_OUTPUT

      - name: Send test report email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🧪 Rapport de tests backendnourpfe - Build #${{ github.run_number }}"
          to: "nourlass50@gmail.com"
          from: "nourlass50@gmail.com"
          html_body: |
            <p>Bonjour,</p>

            <p><strong>Résumé des tests Maven (build #${{ github.run_number }}) :</strong></p>
            <pre>${{ steps.test_summary.outputs.summary }}</pre>

            <p><strong>👉 Liste des tests échoués :</strong></p>
            <pre>${{ steps.test_summary.outputs.failures }}</pre>

            <p>Cordialement,<br/>GitHub Actions</p>
          attachments: target/site/surefire-report.html,failed_tests.txt

      - name: Show Surefire reports if tests fail
        if: failure()
        run: |
          echo "========= Surefire Reports ========="
          find target/surefire-reports -type f -name "*.txt" -exec cat {} \;
          echo "===================================="

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUBNOUR }}
          password: ${{ secrets.DOCKERHUB_TOKENSPRING }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nourlassoued/nourspring:1.0.${{ github.run_number }}

      - name: Checkout argocdpfe repo
        uses: actions/checkout@v4
        with:
          repository: NourLassoued/argocdpfe
          ref: master
          path: argocdpfe
          token: ${{ secrets.CHRR_TOKEN }}

      - name: Update image tag in values.yaml for Spring Boot
        run: |
          IMAGE_TAG="1.0.${{ github.run_number }}"
          sed -i "/springboot:/,/^[^ ]/ s/^\s*tag: \".*\"/    tag: \"${IMAGE_TAG}\"/" argocdpfe/angular-app/values.yaml

      - name: Debug updated values.yaml
        run: |
          echo "----- Updated values.yaml -----"
          cat argocdpfe/angular-app/values.yaml
          echo "--------------------------------"

      - name: Commit and push changes to argocdpfe repo
        run: |
          cd argocdpfe
          git config user.name "GitHub Actions"
          git config user.email "github-action@github.com"
          git add angular-app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Update Spring Boot image tag to 1.0.${{ github.run_number }}"
            git push
          fi
