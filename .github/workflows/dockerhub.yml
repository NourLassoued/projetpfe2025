name: Build and Push Docker Image to Docker Hub 
on:
  push:
    branches:
      - Front
jobs:
  push_to_dockerhub:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUBNOUR }}
          password: ${{ secrets.DOCKERHUBNOURPFE }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nourlassoued/nourangular:1.1.${{ github.run_number }}

      - name: Install jq and Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker image with Trivy and extract numbers
        run: |
          trivy image nourlassoued/nourangular:1.1.${{ github.run_number }} \
            --format json --ignore-unfixed -o trivy-result.json

          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-result.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-result.json)
          MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-result.json)
          LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-result.json)

          echo "CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "HIGH=$HIGH" >> $GITHUB_ENV
          echo "MEDIUM=$MEDIUM" >> $GITHUB_ENV
          echo "LOW=$LOW" >> $GITHUB_ENV

      - name: Show vulnerability details in logs
        run: |
          echo "====== HIGH & MEDIUM Vulnerabilities ======"
          jq '.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="MEDIUM") | {
            Target,
            PkgName,
            InstalledVersion,
            FixedVersion,
            Title,
            Severity
          }' trivy-result.json
          echo "==========================================="
   
      - name: Send Email Notification with Vulnerability Counts
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📊 Scan Trivy – Résumé vulnérabilités Docker image nourangular:1.1.${{ github.run_number }}"
          body: |
            Bonjour,

            Résultat du scan de sécurité Trivy :

            🔴 Critiques : ${{ env.CRITICAL }}
            🟠 Hautes    : ${{ env.HIGH }}
            🟡 Moyennes : ${{ env.MEDIUM }}
            🔵 Faibles   : ${{ env.LOW }}

            Image scannée : nourangular:1.1.${{ github.run_number }}

            Cordialement,
            GitHub Actions Bot
          to: nourlass50@gmail.com
          from: "CI Scanner <nourlass50@gmail.com>"
      - name: Checkout argocdpfe  repo
        uses: actions/checkout@v4
        with:
          repository: NourLassoued/argocdpfe 
          ref: master
        
          path: argocdpfe 
          token: ${{ secrets.CHCR_TOKEN}} 

      - name: Update image tag in angular.yml 
        run: |
          IMAGE_TAG="1.1.${{ github.run_number }}"
          sed -i "/angular:/,/^[^ ]/ s/^\s*tag: \".*\"/ tag: \"${IMAGE_TAG}\"/" argocdpfe/angular-app/values.yaml

      - name: Debug updated values.yaml
        run: |
          echo "----- Updated values.yaml -----"
          cat argocdpfe/angular-app/values.yaml
          echo "--------------------------------"

      - name: Commit and push changes to argocdpfe repo
        run: |
          cd argocdpfe
          git config user.name "GitHub Actions"
          git config user.email "github-action@github.com"
          git add angular-app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Update Docker image tag to 1.1.${{ github.run_number }}"
            git push
          fi
    