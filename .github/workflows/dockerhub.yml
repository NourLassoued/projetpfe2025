name: Build and Push to Docker Hub

on:
  push:
    branches: master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Mise à jour des dépendances Maven pour réduire les vulnérabilités
      - name: Update Maven dependencies
        run: |
          if [ -f "pom.xml" ]; then
            echo "Checking for dependency updates..."
            mvn versions:display-dependency-updates
            # Optionnel: mise à jour automatique des dépendances mineures
            # mvn versions:use-latest-releases
          fi

      - name: Build with Maven
        run: mvn clean package -DskipTests --no-transfer-progress -B

      # Utilisation de l'action officielle Snyk pour Maven
      - name: Run Snyk to check Maven dependencies
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable
        continue-on-error: true

      # Scan de l'image Docker avec Trivy (alternative à Snyk)
      - name: Build Docker image for scanning
        run: docker build -t nourlassoued/nourspring:scan .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'nourlassoued/nourspring:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # Générer un rapport JSON avec Snyk
      - name: Run Snyk and save report
        run: snyk test --severity-threshold=high --json > snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # Générer un rapport JSON avec Trivy
      - name: Run Trivy and save report
        run: trivy image --format json --output trivy-report.json --severity CRITICAL,HIGH nourlassoued/nourspring:scan
        continue-on-error: true

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUBNOUR }}
          password: ${{ secrets.DOCKERHUB_TOKENSPRING}}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ajout de labels de sécurité à l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nourlassoued/nourspring:1.1.${{ github.run_number }}
          build-args: |
            BUILDTIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          labels: |
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      # Envoi des rapports par email
      - name: Send scan results via email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🔒 Résultats des scans Snyk & Trivy - Build #${{ github.run_number }}'
          to: ${{ secrets.EMAIL_USERNAME }}
          from: 'ScanBot <${{ secrets.EMAIL_USERNAME }}>'
          body: |
            Bonjour,

            Voici les rapports de sécurité automatisés pour le projet Docker Maven (`nourspring`).

            - Build : #${{ github.run_number }}
            - Commit : ${{ github.sha }}

            Les rapports sont en pièce jointe.

            Cordialement,
            GitHub Actions
          attachments: snyk-report.json,trivy-report.json
