name: Build & SonarQube Analysis

on:
  push:
    branches:
      - master

jobs:
  sonar-analysis:
    name: Build & Analyze with SonarQube
    runs-on: ubuntu-latest

    steps:
      # 📦 Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour une analyse complète avec l’historique Git

      # ☕ Installation de Java 17 (Zulu = distribution gratuite et compatible)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      # 🚀 Cache pour accélérer les analyses SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 🧰 Cache Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 🛠️ Build + analyse SonarQube
      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONARTOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARHOSTUR }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=backend_nour \
            -Dsonar.projectName="backend_nour"
