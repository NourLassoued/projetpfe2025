

services:
  angular-app:
    container_name: projetservicecontainer
    build: .
    ports:
      - "8080:80"
    networks:
      - projectservicenetwork

  spring-boot-app:
    container_name: projetservicespringboot
    image: springbootapp:latest
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/backendnourpfe
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysql
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - projectservicenetwork

  mysql:
    image: mysql:latest
    container_name: mysql-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projetservice
      MYSQL_PASSWORD: root
    networks:
      - projectservicenetwork

networks:
  projectservicenetwork:
